<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accountabilibuddies</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✏️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff4fa3;--blush:#ffd6ee;--plum:#4b1170;--teal:#12d6c4;--sun:#ffe34d;--ink:#2a0a44}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Fredoka','Trebuchet MS',sans-serif;color:var(--plum);text-align:center;overflow-x:hidden;
 background:radial-gradient(circle at 20% 10%,#fff 0 2px,transparent 3px) 0 0/46px 46px,
 radial-gradient(circle at 70% 60%,#fff8 0 2px,transparent 3px) 0 0/62px 62px,
 linear-gradient(170deg,#ffb3de,#d9a6ff 55%,#9fe9ff);min-height:100vh;padding:20px 14px 60px}
h1{font-family:'Chewy','Comic Sans MS',cursive;font-weight:400;font-size:clamp(2.2rem,9vw,4.4rem);margin:8px 0 0;line-height:1;
 color:#fff;-webkit-text-stroke:3px var(--plum);paint-order:stroke fill;text-shadow:5px 5px 0 var(--pink),9px 9px 0 var(--plum);transform:rotate(-2deg)}
.sub{font-size:1.1rem;margin:18px auto 0;max-width:30em}
.player{max-width:380px;margin:18px auto 0;border:3px solid var(--plum);border-radius:16px;box-shadow:5px 5px 0 var(--plum);overflow:hidden;background:#fff;transform:rotate(-1deg)}
.player iframe{display:block;border:0}
#tube:focus-visible{outline:4px solid var(--teal);outline-offset:3px}
.sky{position:relative;height:190px;margin:6px -14px 0;overflow:hidden}
.flyer{position:absolute;top:10px;left:0;width:300px;animation:fly 13s linear infinite}
.flyer svg{width:100%;overflow:visible;animation:bob 1.6s ease-in-out infinite}
@keyframes fly{from{transform:translateX(-320px)}to{transform:translateX(calc(100vw + 20px))}}
@keyframes bob{50%{transform:translateY(14px) rotate(3deg)}}
#hair{transform-origin:150px 40px;animation:flutter .35s ease-in-out infinite alternate}
@keyframes flutter{from{transform:skewY(-5deg) scaleX(1)}to{transform:skewY(6deg) scaleX(1.12)}}
.leg{transform-origin:top center;animation:kick .8s ease-in-out infinite alternate}
.leg.b{animation-delay:-.4s}
@keyframes kick{from{transform:rotate(-10deg)}to{transform:rotate(14deg)}}
.star{animation:twinkle 1s steps(2) infinite}
.star:nth-child(2n){animation-delay:.3s}.star:nth-child(3n){animation-delay:.6s}
@keyframes twinkle{50%{opacity:.1}}
.stage{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin-top:-10px}
#tube{width:200px;height:460px;overflow:visible}
#liquid{transform:translateY(390px);transition:transform 3s cubic-bezier(.3,1.3,.5,1)}
.wave{animation:slosh 1.8s linear infinite}
@keyframes slosh{to{transform:translateX(-40px)}}
.bub{animation:rise 3.4s ease-in infinite;opacity:.8}
.bub:nth-of-type(2){animation-duration:4.4s;animation-delay:-1s}.bub:nth-of-type(3){animation-duration:2.9s;animation-delay:-2s}
.bub:nth-of-type(4){animation-duration:5s;animation-delay:-3s}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-420px)}}
.marks{list-style:none;margin:0;padding:0;height:390px;position:relative;width:230px;text-align:left;font-weight:600}
.marks li{position:absolute;left:0;padding-left:16px;border-left:4px dotted var(--plum);transform:translateY(-50%);transition:opacity .4s,filter .4s;opacity:.45;filter:grayscale(1)}
.marks li.on{opacity:1;filter:none}
.counter{margin-top:6px}
#num{font-family:'Chewy','Comic Sans MS',cursive;font-size:clamp(2.6rem,12vw,5rem);color:#fff;-webkit-text-stroke:2px var(--plum);paint-order:stroke fill;text-shadow:4px 4px 0 var(--teal)}
.of{font-size:1.2rem}
#msg{display:inline-block;margin-top:12px;background:#fff;border:3px solid var(--plum);border-radius:18px;padding:10px 18px;box-shadow:5px 5px 0 var(--plum);transform:rotate(1.5deg);max-width:92vw}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.flyer{left:calc(50% - 150px)}}
@media (max-width:560px){.marks{width:170px;font-size:.95rem}}
</style>
</head>
<body>
<h1>Accountabilibuddy Tracker</h1>
<p class="sub">Six weeks. Two buddies. One pencil.</p>
<div class="player"><iframe title="Spotify player" src="https://open.spotify.com/embed/track/6dshconh2KBbGxVh7GtSTC?utm_source=generator" width="100%" height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>

<div class="sky" aria-hidden="true">
<div class="flyer">
<svg viewBox="0 0 320 170">
 <g fill="#fff"><path class="star" d="M-10 90l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" transform="translate(20 -10)"/><path class="star" d="M0 0l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" transform="translate(-5 120)"/><path class="star" d="M0 0l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" transform="translate(5 30)"/></g>
 <!-- legs -->
 <g transform="translate(0 0)">
  <g class="leg"><rect x="140" y="110" width="15" height="38" rx="7" fill="#3b2a6e"/><ellipse cx="152" cy="150" rx="12" ry="6" fill="#fff" stroke="#2a0a44" stroke-width="2.5"/></g>
  <g class="leg b"><rect x="158" y="110" width="15" height="36" rx="7" fill="#4b3a8c"/><ellipse cx="170" cy="148" rx="12" ry="6" fill="#fff" stroke="#2a0a44" stroke-width="2.5"/></g>
 </g>
 <!-- pencil -->
 <g stroke="#2a0a44" stroke-width="3" stroke-linejoin="round">
  <rect x="14" y="108" width="26" height="26" rx="8" fill="#ff7bbd"/>
  <rect x="38" y="108" width="16" height="26" fill="#c9c9d6"/>
  <rect x="54" y="108" width="200" height="26" fill="#ffe34d"/>
  <path d="M254 108L304 121L254 134Z" fill="#f4c88f"/>
  <path d="M290 116.5L304 121L290 125.5Z" fill="#2a0a44"/>
 </g>
 <g stroke="#e0b800" stroke-width="3"><path d="M54 121h196"/></g>
 <g stroke="#2a0a44" stroke-width="2"><path d="M42 108v26M46 108v26M50 108v26"/></g>
 <!-- hair back -->
 <g id="hair"><path d="M142 30C122 24 98 32 66 50c9 2 14 6 8 12 11 0 16 6 10 14 12-3 22-2 32 2 10 4 18 0 26-8z" fill="#c78d63"/><path d="M132 38C114 38 96 44 80 56M128 54C112 56 100 62 92 70" stroke="#a96f48" stroke-width="3" fill="none" stroke-linecap="round"/></g>
 <!-- body -->
 <path d="M138 66c-10 6-14 24-10 44h46c4-22 0-40-10-44z" fill="#2b2d33" stroke="#2a0a44" stroke-width="3"/>
 <path d="M147 66l9 22 9-22z" fill="#fff"/>
 <rect x="150" y="88" width="12" height="22" fill="#fff"/>
 <circle cx="143" cy="96" r="2" fill="#aab"/><circle cx="143" cy="106" r="2" fill="#aab"/>
 <!-- arm -->
 <path d="M166 74c14 8 22 20 26 36" stroke="#2b2d33" stroke-width="13" stroke-linecap="round" fill="none"/>
 <circle cx="192" cy="110" r="7" fill="#f6cfb2" stroke="#2a0a44" stroke-width="2.5"/>
 <!-- head -->
 <circle cx="156" cy="44" r="21" fill="#f6cfb2" stroke="#2a0a44" stroke-width="3"/>
 <path d="M135 46C133 28 150 20 164 22c10 2 15 12 13 24-3-6-9-10-15-10-4 4-10 4-15 2-4 2-8 5-12 8z" fill="#c78d63" stroke="#2a0a44" stroke-width="2.5"/>
 <path d="M162 23C160 29 156 34 151 38" stroke="#7a4a2c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <g fill="none" stroke="#3a2418" stroke-width="3"><circle cx="148" cy="46" r="7"/><circle cx="166" cy="46" r="7"/><path d="M155 46h4"/></g>
 <circle cx="148" cy="46" r="2" fill="#2a0a44"/><circle cx="166" cy="46" r="2" fill="#2a0a44"/>
 <path d="M150 58q7 6 14 0" stroke="#c0456f" stroke-width="3" stroke-linecap="round" fill="none"/>
 <circle cx="141" cy="55" r="3.5" fill="#ff8fb5" opacity=".7"/><circle cx="172" cy="55" r="3.5" fill="#ff8fb5" opacity=".7"/>
</svg>
</div>
</div>

<div class="stage">
<svg id="tube" viewBox="0 0 200 460" role="img" aria-label="Test tube showing writing progress" tabindex="0">
 <defs>
  <clipPath id="inside"><path d="M64 40V380A36 36 0 0 0 136 380V40Z"/></clipPath>
  <linearGradient id="goo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4fa3"/><stop offset=".55" stop-color="#b44cff"/><stop offset="1" stop-color="#12d6c4"/></linearGradient>
 </defs>
 <path d="M64 40V380A36 36 0 0 0 136 380V40Z" fill="#ffffffaa"/>
 <g clip-path="url(#inside)">
  <g id="liquid">
   <rect x="40" y="48" width="130" height="420" fill="url(#goo)"/>
   <path class="wave" fill="url(#goo)" d="M0 48q10-9 20 0t20 0 20 0 20 0 20 0 20 0 20 0 20 0 20 0 20 0 20 0 20 0 20 0V70H0Z"/>
   <circle class="bub" cx="84" cy="420" r="5" fill="#fff"/><circle class="bub" cx="108" cy="440" r="7" fill="#fff"/>
   <circle class="bub" cx="124" cy="425" r="4" fill="#fff"/><circle class="bub" cx="96" cy="450" r="3" fill="#fff"/>
  </g>
 </g>
 <path d="M64 40V380A36 36 0 0 0 136 380V40" fill="none" stroke="#2a0a44" stroke-width="5" stroke-linecap="round"/>
 <rect x="52" y="26" width="96" height="16" rx="8" fill="#fff" stroke="#2a0a44" stroke-width="5"/>
 <path d="M74 70V360" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8"/>
 <g stroke="#2a0a44" stroke-width="3"><path d="M64 120h14M64 200h14M64 280h14M64 360h14"/></g>
</svg>
<ul class="marks" id="marks"></ul>
</div>

<div class="counter">
 <div id="num">0</div>
 <div class="of">of <b id="goal"></b> words · <b id="pct"></b></div>
 <div id="msg"></div>
</div>

<script>
// Both numbers are read live from your Google Sheet:
//   B1 = words written so far, B2 = goal.
// The sheet must be shared as "Anyone with the link: Viewer".
const SHEET_ID = '14IWNhqqPW7c8nupQPdm8rVA0yJUYF1HegXEC_tb4-p4';
const FALLBACK_WORDS = 0;      // used if the sheet can't be reached
const FALLBACK_GOAL = 70000;   // used if the sheet can't be reached

const fmt = n => n.toLocaleString('en-GB');

// milestones: tube inside runs y=40 (full) to y=430 (empty)
const marks = [[.25,'25%: gorgeous start'],[.5,'50%: halfway there cowboy'],[.75,'75%: almost hunky bumpkin'],[1,'100%: absolute perfection']];
const ul = document.getElementById('marks');
const lis = marks.map(([p,t]) => {
  const li = document.createElement('li');
  li.style.top = (390 * (1 - p)) + 'px';
  li.textContent = t;
  ul.appendChild(li);
  return li;
});

const msgs = [[0,'Go fill er up buddy!'],[.1,'What a start!'],[.3,'Hot stuff! Keep it coming.'],[.5,'Halfway there ya beauty!'],[.75,'Aaaaaaalmost ya sweetheart (derogatory)!'],[1,'{goal} words. Absolute perfection. No notes.']];
const num = document.getElementById('num');

function render(words, goal){
  const pct = Math.min(1, words / goal);
  document.getElementById('goal').textContent = fmt(goal);
  document.getElementById('pct').textContent = Math.round(pct * 100) + '%';
  lis.forEach((li, i) => li.classList.toggle('on', pct >= marks[i][0]));
  document.getElementById('msg').textContent = [...msgs].reverse().find(m => pct >= m[0])[1].replace('{goal}', fmt(goal));
  setTimeout(() => {
    document.getElementById('liquid').style.transform = `translateY(${(1 - pct) * 390}px)`;
  }, 300);
  const t0 = performance.now();
  (function tick(now){
    const k = Math.min(1, (now - t0) / 2500);
    num.textContent = fmt(Math.round(words * (1 - Math.pow(1 - k, 3))));
    if (k < 1) requestAnimationFrame(tick);
  })(t0);
}

fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&range=B1:B2`, {cache: 'no-store'})
  .then(r => r.ok ? r.text() : Promise.reject())
  .then(t => {
    const [w, g] = t.trim().split(/\r?\n/).map(l => Math.round(Number(l.replace(/[^0-9.]/g, ''))));
    render(isFinite(w) && w >= 0 ? w : FALLBACK_WORDS, isFinite(g) && g > 0 ? g : FALLBACK_GOAL);
  })
  .catch(() => render(FALLBACK_WORDS, FALLBACK_GOAL));

</script>
</body>
</html>
